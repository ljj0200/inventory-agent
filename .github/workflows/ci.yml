name: AI Inventory Agent CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ljj0200/inventory-agent:latest

jobs:

  test:
    runs-on: ubuntu-24.04

    env:
      GEMINI_API_KEY: test-key-for-django-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Push Docker image
        run: docker push ${{ env.IMAGE_NAME }}

  deploy:
    needs: test

    runs-on: [self-hosted, portfolio-deploy]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull --platform linux/amd64 ${{ env.IMAGE_NAME }}

      - name: Deploy on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $existing = docker ps -aq --filter "name=^/ai-inventory-agent-container$"

          if ($existing) {
            docker rm -f ai-inventory-agent-container
          }

          docker run -d --restart unless-stopped --platform linux/amd64 --name ai-inventory-agent-container -p 8000:8000 -e "GEMINI_API_KEY=$env:GEMINI_API_KEY" ${{ env.IMAGE_NAME }}

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }